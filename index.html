<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toy Cleanup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--ink:#1d1a2f;--panel:rgba(29,26,47,.86);--fg:#fff;--yellow:#ffd23f;--blue:#3a86ff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#1d1a2f;--panel:rgba(29,26,47,.86);--fg:#fff}}
:root[data-theme="dark"]{--ink:#1d1a2f;--panel:rgba(29,26,47,.86);--fg:#fff}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);touch-action:none;overscroll-behavior:none;font-family:'Fredoka',system-ui,sans-serif;color:var(--fg)}
body.nocam{background:linear-gradient(#35407a,#1d1a2f)}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none}
.ui{position:fixed;z-index:10}
#count{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--yellow);color:var(--ink);font-weight:700;font-size:20px;padding:8px 18px;border-radius:999px;border:3px solid var(--ink)}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:12px;right:12px;text-align:center;background:var(--panel);padding:12px 16px;border-radius:18px;font-size:17px;line-height:1.3}
.panel{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--panel)}
.panel h1{font-size:40px;margin:0;color:var(--yellow);line-height:1}
.panel p{margin:0;max-width:30ch;font-size:18px;line-height:1.35}
.btn{font:700 20px 'Fredoka',system-ui,sans-serif;background:var(--blue);color:#fff;border:3px solid #fff;border-radius:16px;padding:12px 26px}
.btn.alt{background:transparent;font-size:16px;padding:8px 16px;border-width:2px}
.btn:disabled{opacity:.5}
#songname{font-size:14px;opacity:.8;max-width:34ch}
</style>
</head>
<body>
<video id="vid" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<audio id="au" loop playsinline></audio>

<div class="ui" id="count" hidden>Toys put away: 0 / 5</div>
<div class="ui" id="hint" hidden></div>

<div class="ui panel" id="start">
  <h1>Toy Cleanup</h1>
  <p>Look around your room to find 5 toys. Tap a toy to pick it up, then tap the toy chest.</p>
  <label class="btn alt">Choose a music file<input id="song" type="file" accept="audio/*" hidden></label>
  <div id="songname">Music plays automatically. You can pick a different file if you like.</div>
  <button class="btn" id="go" disabled>Loading…</button>
</div>

<div class="ui panel" id="win" hidden>
  <h1>All cleaned up!</h1>
  <p>Every toy is in the chest. Nice work.</p>
  <button class="btn" onclick="location.reload()">Play again</button>
</div>

<script>
(async () => {
const $ = s => document.querySelector(s), go = $('#go'), note = $('#songname');
window.addEventListener('error', e => { note.textContent = 'Error: ' + e.message; });

// Load three.js (main CDN first, backup CDN second)
const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
try { await load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'); }
catch (e) { try { await load('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'); }
  catch (e2) { go.textContent = 'The 3D library didn’t load. Check your connection and reload.'; return; } }
const THREE = window.THREE;

// ---------- SETTINGS YOU CAN CHANGE ----------
const ARROW_AFTER = 99;  // 99 = arrow is OFF. Set to 3 to bring it back after 3 toys.                  // arrow appears after this many toys are in the chest
const GLITCH_MIN = 7, GLITCH_MAX = 16;  // seconds between music glitches
// Each phone runs its own private copy of this game. Nothing is shared, so nearby players never affect each other.

const D = Math.PI / 180, V = (x, y, z) => new THREE.Vector3(x, y, z), sleep = ms => new Promise(r => setTimeout(r, ms));
const vid = $('#vid'), au = $('#au');
let state = 'idle', carrying = null, deposited = 0, hasGyro = false, chestPos;

// ---------- 3D WORLD ----------
const R = new THREE.WebGLRenderer({ canvas: $('#gl'), alpha: true, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setClearColor(0x000000, 0);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(70, 1, .05, 100);
scene.add(cam, new THREE.AmbientLight(0xffffff, 1.15));
const dl = new THREE.DirectionalLight(0xffffff, .8); dl.position.set(1, 3, 2); scene.add(dl);
const resize = () => { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
resize(); addEventListener('resize', resize);

const sp = r => new THREE.SphereGeometry(r, 24, 16), cy = (r, h) => new THREE.CylinderGeometry(r, r, h, 20),
  bx = (w, h, d) => new THREE.BoxGeometry(w, h, d), cn = (r, h) => new THREE.ConeGeometry(r, h, 20), to = (r, t) => new THREE.TorusGeometry(r, t, 12, 32);
function add(g, geo, col, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: col }));
  m.position.set(x, y, z); m.rotation.set(rx * D, ry * D, rz * D); g.add(m); return m;
}
// ===== TOY SHAPES: replace these with your SketchUp models later =====
const BUILD = {
  teddy: g => { const c = '#a0642f';                       // stiff: arms and legs stick straight out
    add(g, sp(.28), c); add(g, sp(.2), '#b97a3c', 0, .42, 0); add(g, sp(.07), '#8c5324', -.15, .6, 0); add(g, sp(.07), '#8c5324', .15, .6, 0);
    add(g, sp(.1), '#e8c9a0', 0, .38, .18); add(g, cy(.07, .42), c, -.4, .12, 0, 0, 0, 90); add(g, cy(.07, .42), c, .4, .12, 0, 0, 0, 90);
    add(g, cy(.08, .4), c, -.14, -.2, .25, 90); add(g, cy(.08, .4), c, .14, -.2, .25, 90); },
  cube: g => { add(g, bx(.4, .4, .4), '#111'); add(g, bx(.42, .42, .13), '#e63946'); add(g, bx(.13, .42, .42), '#2a6fdb'); add(g, bx(.42, .13, .42), '#ffd23f'); },
  duck: g => { add(g, sp(.3), '#ffd93b').scale.set(1, .85, 1.2); add(g, sp(.18), '#ffd93b', 0, .32, .12); add(g, sp(.12), '#ffd93b', 0, .1, -.38);
    add(g, cn(.07, .16), '#ff8c1a', 0, .3, .32, 90); add(g, sp(.03), '#111', -.08, .38, .27); add(g, sp(.03), '#111', .08, .38, .27); },
  ball: g => { add(g, sp(.3), '#d6f0ff'); add(g, to(.3, .035), '#ff9ecb'); add(g, to(.3, .035), '#ff9ecb', 0, 0, 0, 0, 90); },
  rings: g => { add(g, cy(.22, .06), '#3a86ff', 0, -.25, 0); add(g, cy(.035, .55), '#eeeeee', 0, .03, 0);
    [['#ef476f', .19, -.17], ['#ff9f1c', .16, -.09], ['#06d6a0', .13, -.01], ['#9b5de5', .1, .07]].forEach(([c, r, y]) => add(g, to(r, .05), c, 0, y, 0, 90)); },
  chest: g => { add(g, bx(1.2, .55, .7), '#8b5a2b', 0, -.1, 0); add(g, bx(1.22, .2, .72), '#a8692f', 0, .27, 0);
    add(g, bx(.1, .62, .76), '#e6b422', -.4, .05, 0); add(g, bx(.1, .62, .76), '#e6b422', .4, .05, 0); add(g, bx(.16, .18, .05), '#e6b422', 0, .2, .37); }
};
const DEFS = {
  teddy: { scale: 1.3, carry: .55, follow: 1,   drop: .5,  msg: 'So stiff! He doesn’t flop at all. Find the toy chest.' },
  cube:  { scale: 1.3, carry: .6,  follow: .2,  drop: .5,  msg: 'Got it! Quick, take it to the toy chest.' },
  duck:  { scale: 1.8, carry: .9,  follow: .2,  drop: .6,  msg: 'That’s one big duck! Find the toy chest.' },
  ball:  { scale: 1.3, carry: .75, follow: .015, drop: .6, msg: 'Whoa, it’s way heavier than it looks! Find the toy chest.' },
  rings: { scale: 1.3, carry: .6,  follow: .2,  drop: .5,  msg: 'Got the ring stacker! Find the toy chest.' }
};
const toys = Object.keys(DEFS).map(id => { const o = new THREE.Group(); BUILD[id](o); o.visible = false; o.userData.id = id; scene.add(o);
  return { id, o, d: DEFS[id], pos: V(0, 0, 0), done: false, anim: null }; });
const chestG = new THREE.Group(); BUILD.chest(chestG); chestG.visible = false; chestG.userData.id = 'chest'; scene.add(chestG);

// guide arrow, stuck to the camera
const am = new THREE.MeshBasicMaterial({ color: '#ffd23f' }), arrow = new THREE.Group();
const hd = new THREE.Mesh(new THREE.ConeGeometry(.14, .3, 16), am); hd.position.y = .4;
arrow.add(new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .5, 16), am), hd);
arrow.position.set(0, -.5, -1.3); arrow.scale.setScalar(.6); arrow.visible = false; cam.add(arrow);

const sph = s => { const c = Math.cos(s.pitch); return V(-s.r * c * Math.sin(s.yaw), s.r * Math.sin(s.pitch), -s.r * c * Math.cos(s.yaw)); };
const say = m => { const h = $('#hint'); h.hidden = false; h.textContent = m; };

// ---------- PHONE MOTION -> CAMERA ----------
addEventListener('deviceorientation', e => {
  if (e.alpha == null) return;
  hasGyro = true;
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e.beta * D, e.alpha * D, -e.gamma * D, 'YXZ'));
  q.multiply(new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5)));
  const o = (screen.orientation ? screen.orientation.angle : (window.orientation || 0)) * D;
  q.multiply(new THREE.Quaternion().setFromAxisAngle(V(0, 0, 1), -o));
  cam.quaternion.copy(q);
});
let ry = 0, rx = 0;   // desktop testing: drag with the mouse to look around
let lx = 0, ly = 0;
addEventListener('pointerdown', e => { lx = e.clientX; ly = e.clientY; });
addEventListener('pointermove', e => { const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; if (hasGyro || !(e.buttons & 1)) return; ry += dx * .004; rx = Math.max(-1.4, Math.min(1.4, rx + dy * .004)); cam.rotation.set(rx, ry, 0, 'YXZ'); });

// ---------- START ----------
// ===== YOUR SKETCHUP MODELS: file name, and size in the game (the longest side, in meters) =====
const MODELS = { teddy: ['teddy.glb', .8], cube: ['rubiks-cube.glb', .4], duck: ['duck.glb', .6],
  ball: ['ball.glb', .6], rings: ['ring-stacker.glb', .6], chest: ['toy-chest.glb', 1.2] };
const useModel = (g, file, size) => new Promise(done => {
  new THREE.GLTFLoader().load(file, gltf => {
    const m = gltf.scene, box = new THREE.Box3().setFromObject(m), s = box.getSize(V(0, 0, 0)), c = box.getCenter(V(0, 0, 0));
    const k = size / Math.max(s.x, s.y, s.z);                 // auto-resize so any SketchUp size works
    m.scale.setScalar(k); m.position.sub(c.multiplyScalar(k)); // and center it
    const wrap = new THREE.Group(); wrap.add(m);
    while (g.children.length) g.remove(g.children[0]);         // remove the plain placeholder shapes
    g.add(wrap); done(true);
  }, undefined, () => done(false));
});
go.textContent = 'Loading toys…';
try { await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js'); } catch (e) {}
const failed = [];
if (THREE.GLTFLoader) await Promise.all(Object.entries(MODELS).map(async ([id, [file, size]]) => {
  const g = id === 'chest' ? chestG : toys.find(t => t.id === id).o;
  if (!(await useModel(g, file, size))) failed.push(file);
}));
else failed.push('(model loader)');
if (failed.length) note.textContent = 'Couldn’t load: ' + failed.join(', ') + '. Using plain shapes for those.';
go.disabled = false; go.textContent = 'Start';
go.onclick = async () => {
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  try { vid.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); await vid.play(); }
  catch (e) { document.body.classList.add('nocam'); }
  if (au.src) au.play().catch(() => {});
  $('#start').hidden = true;
  setTimeout(place, 800);
};

function place() {
  const f = V(0, 0, -1).applyQuaternion(cam.quaternion), yaw0 = Math.atan2(-f.x, -f.z);
  const pitches = [-45, -15, 10, 35, 55].sort(() => Math.random() - .5);   // low, level, and high spots
  [...toys].sort(() => Math.random() - .5).forEach((t, i) => {
    t.s = { yaw: yaw0 + (45 + i * 68 + Math.random() * 30 - 15) * D, pitch: (pitches[i] + Math.random() * 10 - 5) * D, r: 3.5 + Math.random() * 1.8 };
    t.tgt = { ...t.s }; t.phase = Math.random() * 6; t.pos.copy(sph(t.s));
    t.o.visible = true; t.o.scale.setScalar(t.d.scale); t.o.position.copy(t.pos); t.o.lookAt(0, 0, 0);
  });
  chestPos = sph({ yaw: yaw0, pitch: -28 * D, r: 2.6 });
  chestG.visible = true; chestG.scale.setScalar(1.3); chestG.position.copy(chestPos); chestG.lookAt(0, 0, 0);
  state = 'play'; $('#count').hidden = false;
  say('Look around the room and tap a toy to pick it up.');
  glitchMusic();
}

// ---------- TAPPING ----------
const rc = new THREE.Raycaster();
addEventListener('pointerdown', e => {
  if (state !== 'play' || e.target.closest('.ui')) return;
  rc.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, cam);
  const hit = rc.intersectObjects([chestG, ...toys.filter(t => !t.done && !t.anim && t !== carrying).map(t => t.o)], true)[0];
  if (!hit) return;
  let o = hit.object; while (o && !o.userData.id) o = o.parent;
  if (!o) return;
  if (o.userData.id === 'chest') {
    if (!carrying) return say('That’s the toy chest. Find a toy to put in it.');
    const t = carrying; carrying = null; t.anim = { t0: performance.now(), from: t.pos.clone() };
    return;
  }
  const t = toys.find(x => x.id === o.userData.id);
  if (carrying) return say('Your hands are full. Put it in the toy chest first.');
  if (t.id === 'cube') {                      // the cube dodges, but gets tired
    t.tries = (t.tries || 0) + 1;
    if (Math.random() >= .25 * t.tries) {
      t.tgt.yaw = t.s.yaw + (Math.random() < .5 ? -1 : 1) * (40 + Math.random() * 40) * D;
      t.tgt.pitch = Math.min(t.s.pitch + .35, 55 * D);
      return say('It dodged! Keep trying, it’s getting tired.');
    }
  }
  carrying = t; t.t0 = performance.now(); $('#hint').hidden = true;
});

// ---------- GAME LOOP ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now;
  if (state === 'play') update(now, dt);
  R.render(scene, cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(now, dt) {
  const f = V(0, 0, -1).applyQuaternion(cam.quaternion), up = V(0, 1, 0).applyQuaternion(cam.quaternion);
  for (const t of toys) {
    if (t.done) continue;
    const o = t.o;
    if (t.anim) {                               // flying into the chest
      const p = Math.min((now - t.anim.t0) / 500, 1);
      t.pos.lerpVectors(t.anim.from, chestPos.clone().add(V(0, .4, 0)), p);
      o.position.copy(t.pos); o.scale.setScalar(t.d.carry * (1 - .9 * p));
      if (p >= 1) { t.done = true; t.anim = null; o.visible = false; onDeposit(); }
    } else if (t === carrying) {                // being held
      const k = t.d.follow >= 1 ? 1 : 1 - Math.pow(1 - t.d.follow, dt * 60);
      const sag = t.id === 'ball' ? Math.min((now - t.t0) / 6000, 1) * .2 : 0;   // the ball sags the longer you hold it
      t.pos.lerp(f.clone().multiplyScalar(1.1).addScaledVector(up, -(t.d.drop + sag)), k);
      o.position.copy(t.pos); o.scale.setScalar(t.d.carry);
      if (t.id === 'ball') o.position.add(V(Math.sin(now / 37), Math.sin(now / 29), 0).multiplyScalar(.012));   // strain wobble
      o.quaternion.copy(cam.quaternion);
      if (t.id !== 'teddy') o.rotateZ(Math.sin(now / 220) * .12);    // teddy stays rigid, others sway
    } else {                                    // sitting in the room
      let bob = 0;
      if (t.id === 'cube') {                    // floats up and away, spins
        t.tgt.pitch += .06 * dt;
        if (t.tgt.pitch > 60 * D) { t.tgt.pitch = -20 * D; t.tgt.yaw += 70 * D; }
        const k = 1 - Math.pow(.92, dt * 60);
        t.s.yaw += (t.tgt.yaw - t.s.yaw) * k; t.s.pitch += (t.tgt.pitch - t.s.pitch) * k;
        o.rotation.y += dt * 1.5; o.rotation.x += dt * .7;
      }
      if (t.id === 'ball' || t.id === 'duck') bob = Math.sin(now / 600 + t.phase) * .06;
      t.pos.copy(sph(t.s)); t.pos.y += bob; o.position.copy(t.pos);
    }
  }
  if (deposited >= ARROW_AFTER && deposited < 5) {      // guide arrow
    let target = null, best = -2;
    if (carrying) target = chestPos;
    else for (const t of toys) if (!t.done && !t.anim) { const d = f.dot(t.pos.clone().normalize()); if (d > best) { best = d; target = t.pos; } }
    if (target) {
      const w = target.clone().normalize();
      arrow.quaternion.setFromUnitVectors(V(0, 1, 0), w.clone().applyQuaternion(cam.quaternion.clone().invert()));
      arrow.visible = true;
      if (f.dot(w) > .94 && !carrying) say('It’s right in front of you!');
    }
  } else arrow.visible = false;
}

function onDeposit() {
  deposited++;
  $('#count').textContent = 'Toys put away: ' + deposited + ' / 5';
  if (deposited >= 5) {
    state = 'won'; arrow.visible = false; au.playbackRate = 1; au.muted = false;
    $('#hint').hidden = true; $('#win').hidden = false;
  } else if (deposited === ARROW_AFTER) say('Nice! Follow the yellow arrow to find the rest.');
  else say('In the chest! Find the next toy.');
}

// ---------- MUSIC (your own file) WITH GLITCHES ----------
au.preservesPitch = false; au.webkitPreservesPitch = false;
au.src = 'cleanup-song.mp3';   // the song file in your repo, in the same folder as index.html (name must match exactly)
$('#song').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  au.src = URL.createObjectURL(file); note.textContent = 'Music: ' + file.name;
  if (state !== 'idle') au.play().catch(() => {});
};
async function ramp(to, ms) { const from = au.playbackRate, n = 20; for (let i = 1; i <= n; i++) { au.playbackRate = from + (to - from) * i / n; await sleep(ms / n); } }
async function glitchMusic() {
  while (state === 'play') {
    await sleep((GLITCH_MIN + Math.random() * (GLITCH_MAX - GLITCH_MIN)) * 1000);
    if (state !== 'play' || !au.src) continue;
    if (Math.random() < .5) { await ramp(.55, 2500); await sleep(1500 + Math.random() * 3000); await ramp(1, 800); }   // too slow
    else { au.muted = true; await sleep(3000 + Math.random() * 4000); au.muted = false; }                              // silent
  }
  au.playbackRate = 1; au.muted = false;
}
})();
</script>
</body>
</html>
